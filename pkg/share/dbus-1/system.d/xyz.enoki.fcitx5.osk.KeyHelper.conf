<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="xyz.enoki.fcitx5.osk.KeyHelper"/>
  </policy>
  <policy context="default">
    <allow send_destination="xyz.enoki.fcitx5.osk.KeyHelper" send_interface="xyz.enoki.fcitx5.osk.KeyHelper.Controller1"/>
  </policy>
</busconfig>
